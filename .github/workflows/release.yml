name: MİHENK kararlı sürüm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: mihenk-kararli-yayin
  cancel-in-progress: false

jobs:
  hazirla:
    name: Kararlı sürüm taslağını hazırla
    runs-on: ubuntu-latest
    outputs:
      release_id: ${ steps.release.outputs.release_id }
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Sürümü doğrula ve tek taslak yayın oluştur
        id: release
        env:
          GH_TOKEN: ${ secrets.GITHUB_TOKEN }
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          CONFIG_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")"
          CARGO_VERSION="$(node -e "const t=require('fs').readFileSync('src-tauri/Cargo.toml','utf8'); console.log(t.match(/\\[package\\][\\s\\S]*?version = \\\"([^\\\"]+)\\\"/)[1])")"
          test "$VERSION" = "$PACKAGE_VERSION"
          test "$VERSION" = "$CONFIG_VERSION"
          test "$VERSION" = "$CARGO_VERSION"

          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"

          RELEASE_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \\"${GITHUB_REF_NAME}\\" and .draft == true) | .id" | head -n1 || true)"
          if [[ -z "$RELEASE_ID" ]]; then
            PUBLISHED_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name == \\"${GITHUB_REF_NAME}\\" and .draft == false) | .id" | head -n1 || true)"
            if [[ -n "$PUBLISHED_ID" ]]; then
              echo "Bu etiket için yayımlanmış bir sürüm zaten var; mevcut sürümün üzerine yazılmayacak." >&2
              exit 1
            fi
            RELEASE_ID="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \\
              -f tag_name="$GITHUB_REF_NAME" \\
              -f name="MİHENK $GITHUB_REF_NAME" \\
              -f body="Windows ve Linux kurulum paketleri. Yayın, iki platformun açılış testleri ve paket/imza doğrulaması tamamlanınca kullanıma açılır." \\
              -F draft=true \\
              -F prerelease=false \\
              -f target_commitish="$GITHUB_SHA" \\
              --jq '.id')"
          fi

          test -n "$RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  paketle:
    name: ${ matrix.platform } kararlı paketleri
    needs: hazirla
    runs-on: ${ matrix.platform }
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: "appimage,deb"
          - platform: windows-latest
            bundles: "nsis,msi"
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${ secrets.TAURI_SIGNING_PRIVATE_KEY }
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }
      TAURI_UPDATER_PUBLIC_KEY: ${ vars.TAURI_UPDATER_PUBLIC_KEY }
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable
      - name: Linux paket bağımlılıklarını kur
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \\
            libwebkit2gtk-4.1-dev \\
            build-essential \\
            curl \\
            wget \\
            file \\
            libxdo-dev \\
            libssl-dev \\
            libayatana-appindicator3-dev \\
            librsvg2-dev \\
            patchelf \\
            xvfb
      - name: Bağımlılıkları kilitli kur
        run: npm ci --no-audit --no-fund
      - name: Kare uygulama simgelerini üret
        run: npx tauri icon src-tauri/icons/mihenk.svg --output src-tauri/icons
      - name: Yayın sürümü yapılandırmasını oluştur
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          node - "$VERSION" "$TAURI_UPDATER_PUBLIC_KEY" <<'NODE'
          const fs = require("node:fs");
          const [version, pubkey] = process.argv.slice(2);
          const config = JSON.parse(fs.readFileSync("src-tauri/tauri.release.conf.json", "utf8"));
          config.version = version;
          config.plugins.updater.pubkey = pubkey;
          config.plugins.updater.endpoints = ["https://github.com/azmisahin-gov/mihenk/releases/latest/download/latest.json"];
          fs.writeFileSync("src-tauri/tauri.generated.conf.json", JSON.stringify(config, null, 2) + "\n");
          NODE
          echo "VITE_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Güncelleme imza anahtarını UTF-8 BOM karakterinden arındır
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const raw = process.env.TAURI_SIGNING_PRIVATE_KEY || "";
          let key = raw;
          if (key.charCodeAt(0) === 0xfeff) key = key.slice(1);
          if (key.startsWith("ï»¿")) key = key.slice(3);
          key = key.trim();
          if (!key) throw new Error("TAURI_SIGNING_PRIVATE_KEY boş.");
          const delimiter = "MIHENK_PRIVATE_KEY_END";
          if (key.includes(delimiter)) throw new Error("İmza anahtarı ayırıcıyla çakışıyor.");
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            \`TAURI_SIGNING_PRIVATE_KEY<<\${delimiter}\\n\${key}\\n\${delimiter}\\n\`,
            { encoding: "utf8", mode: 0o600 },
          );
          NODE
      - name: Paketleri aynı taslak sürüme yükle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${ secrets.GITHUB_TOKEN }
        with:
          projectPath: .
          releaseId: ${ needs.hazirla.outputs.release_id }
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.generated.conf.json --bundles ${ matrix.bundles }

      - name: Linux yayın ikilisinin açılışını doğrula
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          APP="./src-tauri/target/release/mihenk"
          if [[ ! -x "$APP" ]]; then
            echo "Yayın ikilisi bulunamadı: $APP" >&2
            exit 1
          fi
          STARTUP_LOG="${XDG_DATA_HOME:-$HOME/.local/share}/com.mihenk.desktop/logs/startup.log"
          OUTPUT_LOG="$RUNNER_TEMP/mihenk-stable-linux.log"
          rm -f "$STARTUP_LOG"
          xvfb-run -a bash -c '
            set -euo pipefail
            "$1" > "$2" 2>&1 &
            app_pid=$!
            cleanup() {
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            for attempt in $(seq 1 20); do
              if ! kill -0 "$app_pid" 2>/dev/null; then
                wait "$app_pid" || true
                exit 1
              fi
              sleep 1
            done
            kill -0 "$app_pid"
          ' _ "$APP" "$OUTPUT_LOG" || {
            cat "$OUTPUT_LOG" 2>/dev/null || true
            cat "$STARTUP_LOG" 2>/dev/null || true
            echo "Linux yayın ikilisi 20 saniye açık kalamadı." >&2
            exit 1
          }
          echo "Linux yayın ikilisi 20 saniye açık kaldı."

      - name: Windows yayın ikilisinin açılışını doğrula
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Join-Path $PWD "src-tauri/target/release/mihenk.exe"
          if (-not (Test-Path $app)) {
            throw "Yayın ikilisi bulunamadı: $app"
          }
          $startupLog = Join-Path $env:LOCALAPPDATA "com.mihenk.desktop\logs\startup.log"
          if (Test-Path $startupLog) { Remove-Item $startupLog -Force }
          $webViewData = Join-Path $env:RUNNER_TEMP "mihenk-stable-webview2"
          New-Item -ItemType Directory -Force -Path $webViewData | Out-Null
          $env:WEBVIEW2_USER_DATA_FOLDER = $webViewData
          $stdout = Join-Path $env:RUNNER_TEMP "mihenk-stable-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "mihenk-stable-stderr.log"
          $process = Start-Process -FilePath $app -WorkingDirectory (Split-Path $app) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            for ($attempt = 1; $attempt -le 20; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                $outText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
                $errText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
                $startupText = if (Test-Path $startupLog) { Get-Content $startupLog -Raw } else { "Başlangıç günlük dosyası oluşmadı." }
                throw "Windows yayın ikilisi açıldıktan sonra kapandı. Çıkış kodu: $($process.ExitCode). stdout: $outText stderr: $errText başlangıç günlüğü: $startupText"
              }
            }
            Write-Output "Windows yayın ikilisi 20 saniye açık kaldı."
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

  yayina-al:
    name: Kararlı sürümü doğrula ve yayımla
    needs: [hazirla, paketle]
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Tüm platform dosyalarını ve imzalarını doğrula
        env:
          GH_TOKEN: ${ secrets.GITHUB_TOKEN }
          RELEASE_ID: ${ needs.hazirla.outputs.release_id }
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ASSETS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[].name')"
          REQUIRED_ASSETS=(
            "MIHENK_${VERSION}_amd64.AppImage"
            "MIHENK_${VERSION}_amd64.AppImage.sig"
            "MIHENK_${VERSION}_amd64.deb"
            "MIHENK_${VERSION}_amd64.deb.sig"
            "MIHENK_${VERSION}_x64-setup.exe"
            "MIHENK_${VERSION}_x64-setup.exe.sig"
            "MIHENK_${VERSION}_x64_tr-TR.msi"
            "MIHENK_${VERSION}_x64_tr-TR.msi.sig"
            "latest.json"
          )
          for asset in "\${REQUIRED_ASSETS[@]}"; do
            if ! grep -Fqx "$asset" <<< "$ASSETS"; then
              echo "Kararlı sürüm yayımlanmadı; gerekli dosya eksik: $asset" >&2
              exit 1
            fi
          done
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -F prerelease=false
