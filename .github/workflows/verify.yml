name: MİHENK doğrulama

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  arayuz:
    name: TypeScript ve üretim derlemesi
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Kilitli JavaScript bağımlılıklarını kur
        run: npm ci --no-audit --no-fund
      - name: Birim testleri
        run: npm test
      - name: TypeScript denetimi
        run: npm run check
      - name: İndirme sayfası JavaScript sözdizimini doğrula
        run: node --check docs/site.js
      - name: Üretim ön yüzünü derle
        run: npm run build

  masaustu:
    name: Tauri masaüstü derleme denetimi
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Rust kur
        uses: dtolnay/rust-toolchain@1.99.1
      - name: Linux Sherpa native arşivini sabit SHA-256 ile hazırla
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive_name="sherpa-onnx-v2.0.1-linux-x64-static-lib.tar.bz2"
          archive_dir="$RUNNER_TEMP/sherpa-onnx-archives"
          mkdir -p "$archive_dir"
          curl --fail --location --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/$archive_name" \
            --output "$archive_dir/$archive_name"
          printf '%s  %s\n' \
            "55cfadf65ba50d0afc1a802b7a337942819e51c94a5b5a384def1978f7c70871" \
            "$archive_dir/$archive_name" | sha256sum --check
          echo "SHERPA_ONNX_ARCHIVE_DIR=$archive_dir" >> "$GITHUB_ENV"
      - name: Windows Sherpa native arşivini sabit SHA-256 ile hazırla
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archiveName = "sherpa-onnx-v2.0.1-win-x64-static-MT-Release-lib.tar.bz2"
          $archiveDir = Join-Path $env:RUNNER_TEMP "sherpa-onnx-archives"
          New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null
          $archivePath = Join-Path $archiveDir $archiveName
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/$archiveName"
          Invoke-WebRequest -Uri $url -OutFile $archivePath
          $actual = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()
          $expected = "23e7b986b197eda0bbc47ff3d7d5c87afd6ef2b9077214ba26b0f1ec52ef0e66"
          if ($actual -ne $expected) {
            throw "Sherpa native Windows arşivi SHA-256 doğrulamasını geçemedi: $actual"
          }
          "SHERPA_ONNX_ARCHIVE_DIR=$archiveDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Windows için libsodium arşivini doğrulayarak hazırla
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-libsodium-windows.ps1
      - name: Windows kurulum testi betiklerinin sözdizimini doğrula
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @(
            "scripts/test-windows-installed-msi.ps1",
            "scripts/test-windows-installed-nsis.ps1",
            "scripts/test-windows-release-binary.ps1",
            "scripts/test-windows-loader-baseline.ps1",
            "scripts/inspect-windows-pe-dependencies.ps1",
            "scripts/test-windows-forbidden-dll-imports.ps1",
            "scripts/prepare-webview2-runtime-windows.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw ("PowerShell sözdizimi hatası: " + $path + " " + ($errors | Out-String))
            }
            Write-Host ("PowerShell sözdizimi başarılı: " + $path)
          }
      - name: Linux bağımlılıklarını kur
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb
      - name: Kilitli JavaScript bağımlılıklarını kur
        run: npm ci --no-audit --no-fund
      - name: Kare uygulama simgelerini üret
        run: npx tauri icon src-tauri/icons/mihenk.svg --output src-tauri/icons
      - name: Ön yüzü derle
        run: npm run build
      - name: Kilitli Tauri Rust bağımlılıklarını denetle
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust birim testleri
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Masaüstü ikilisini derle
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - name: Linux sanal ekranda uygulamayı başlat
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a bash -lc '
            ./src-tauri/target/debug/mihenk &
            app_pid=$!
            cleanup() {
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            for attempt in $(seq 1 20); do
              if ! kill -0 "$app_pid" 2>/dev/null; then
                wait "$app_pid"
                exit 1
              fi
              sleep 1
            done
            kill -0 "$app_pid"
          '
      - name: Windows uygulamasını başlatma denetimi
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Join-Path $PWD "src-tauri/target/debug/mihenk.exe"
          if (-not (Test-Path $app)) {
            throw "Masaüstü ikilisi bulunamadı: $app"
          }

          $stdout = Join-Path $env:RUNNER_TEMP "mihenk-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "mihenk-stderr.log"
          $webViewData = Join-Path $env:RUNNER_TEMP "mihenk-webview2"
          New-Item -ItemType Directory -Force -Path $webViewData | Out-Null
          $env:WEBVIEW2_USER_DATA_FOLDER = $webViewData

          $process = Start-Process -FilePath $app -WorkingDirectory (Split-Path $app) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            for ($attempt = 1; $attempt -le 15; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                $outText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
                $errText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
                throw "MİHENK başlatıldıktan sonra kapandı. Çıkış kodu: $($process.ExitCode). stdout: $outText stderr: $errText"
              }
            }

            Write-Output "MİHENK Windows süreci 15 saniye boyunca açık kaldı. PID: $($process.Id)"
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
