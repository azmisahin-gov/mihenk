name: MİHENK geliştirme önizlemesi

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: mihenk-onizleme-yayin
  cancel-in-progress: false

jobs:
  hazirla:
    name: Tek önizleme kaydı hazırla
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Eski önizleme kayıtlarını temizle ve tek taslak oluştur
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git push origin "${GITHUB_SHA}:refs/tags/preview" --force

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.tag_name == "preview" and .draft == true) | .id' |
            while IFS= read -r old_release_id; do
              [[ -n "$old_release_id" ]] || continue
              echo "Önceki önizleme kaydı kaldırılıyor: $old_release_id"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${old_release_id}"
            done

          RELEASE_ID="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name=preview \
            -f name="MİHENK Geliştirme Önizlemesi" \
            -f body="main dalındaki en son geliştirme yapısıdır. Deneme içindir; kararlı sürüm değildir." \
            -F draft=true \
            -F prerelease=true \
            -f target_commitish="${GITHUB_SHA}" \
            --jq '.id')"
          test -n "$RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  paketle:
    name: ${{ matrix.platform }} önizleme paketleri
    needs: hazirla
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: "appimage,deb"
          - platform: windows-2022
            bundles: "nsis,msi"
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Rust kur
        uses: dtolnay/rust-toolchain@1.99.1
      - name: Windows için libsodium arşivini doğrulayarak hazırla
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-libsodium-windows.ps1
      - name: Linux paket bağımlılıklarını kur
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb
      - name: Bağımlılıkları kilitli kur
        run: npm ci --no-audit --no-fund
      - name: Kare uygulama simgelerini üret
        run: npx tauri icon src-tauri/icons/mihenk.svg --output src-tauri/icons
      - name: Önizleme sürümünü ve imza anahtarlarını hazırla
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(node -p "require('./package.json').version")"
          PREVIEW_VERSION="${BASE_VERSION}-${GITHUB_RUN_NUMBER}"
          if (( PREVIEW_RUN_NUMBER = ${GITHUB_RUN_NUMBER} )) && (( PREVIEW_RUN_NUMBER > 65535 )); then
            echo "MSI önizleme sürüm bileşeni 65535 sınırını aştı; package.json patch sürümünü artırın." >&2
            exit 1
          fi
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          node - "$PREVIEW_VERSION" "$TAURI_UPDATER_PUBLIC_KEY" <<'NODE'
          const fs = require("node:fs");
          const [version, pubkey] = process.argv.slice(2);
          const config = JSON.parse(fs.readFileSync("src-tauri/tauri.release.conf.json", "utf8"));
          config.version = version;
          config.plugins.updater.pubkey = pubkey;
          config.plugins.updater.endpoints = ["https://github.com/azmisahin-gov/mihenk/releases/download/preview/latest.json"];
          fs.writeFileSync("src-tauri/tauri.generated.conf.json", JSON.stringify(config, null, 2) + "\n");
          NODE
          echo "VITE_APP_VERSION=$PREVIEW_VERSION" >> "$GITHUB_ENV"
      - name: Windows runner Rust/MSVC loader baseline denetimi
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-loader-baseline.ps1
      - name: Windows ham yayın ikilisini paketlemeden önce derle
        if: runner.os == 'Windows'
        shell: pwsh
        run: npx tauri build --no-bundle --ci --config src-tauri/tauri.generated.conf.json
      - name: Windows paketleme öncesi PE ve DLL bağımlılıklarını kaydet
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/inspect-windows-pe-dependencies.ps1 -Stage pre-bundle
      - name: Windows paketleme öncesi hatalı Vertdll importunu reddet
        id: pre_bundle_imports
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/test-windows-forbidden-dll-imports.ps1
      - name: Windows Evergreen WebView2 Runtime'ı hazırla
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-webview2-runtime-windows.ps1
      - name: Windows paketleme öncesi ham EXE açılışını doğrula
        id: pre_bundle_smoke
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/test-windows-release-binary.ps1
      - name: Güncelleme imza anahtarını UTF-8 BOM karakterinden arındır
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const raw = process.env.TAURI_SIGNING_PRIVATE_KEY || "";
          let key = raw;
          if (key.charCodeAt(0) === 0xfeff) key = key.slice(1);
          if (key.startsWith("ï»¿")) key = key.slice(3);
          key = key.trim();
          if (!key) throw new Error("TAURI_SIGNING_PRIVATE_KEY boş.");
          process.stdout.write(`::add-mask::${key}\n`);
          const delimiter = "MIHENK_PRIVATE_KEY_END";
          if (key.includes(delimiter)) throw new Error("İmza anahtarı ayırıcıyla çakışıyor.");
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `TAURI_SIGNING_PRIVATE_KEY<<${delimiter}\n${key}\n${delimiter}\n`,
            { encoding: "utf8", mode: 0o600 },
          );
          NODE
      - name: Derle ve önizleme kanalına yayımla
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          releaseId: ${{ needs.hazirla.outputs.release_id }}
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.generated.conf.json --bundles ${{ matrix.bundles }}

      - name: Windows paketleme sonrası PE ve DLL bağımlılıklarını kaydet
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/inspect-windows-pe-dependencies.ps1 -Stage post-bundle
      - name: Windows paketleme sonrası hatalı Vertdll importunu reddet
        id: post_bundle_imports
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/test-windows-forbidden-dll-imports.ps1
      - name: İmza anahtarını sonraki adımların ortamından temizle
        shell: bash
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY=" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      - name: Linux yayın ikilisinin açılışını doğrula
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          APP="./src-tauri/target/release/mihenk"
          if [[ ! -x "$APP" ]]; then
            echo "Yayın ikilisi bulunamadı: $APP" >&2
            exit 1
          fi
          STARTUP_LOG="${XDG_DATA_HOME:-$HOME/.local/share}/com.mihenk.desktop/logs/startup.log"
          OUTPUT_LOG="$RUNNER_TEMP/mihenk-release-linux.log"
          rm -f "$STARTUP_LOG"
          xvfb-run -a bash -c '
            set -euo pipefail
            "$1" > "$2" 2>&1 &
            app_pid=$!
            cleanup() {
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            for attempt in $(seq 1 20); do
              if ! kill -0 "$app_pid" 2>/dev/null; then
                wait "$app_pid" || true
                exit 1
              fi
              sleep 1
            done
            kill -0 "$app_pid"
          ' _ "$APP" "$OUTPUT_LOG" || {
            cat "$OUTPUT_LOG" 2>/dev/null || true
            cat "$STARTUP_LOG" 2>/dev/null || true
            echo "Linux yayın ikilisi 20 saniye açık kalamadı." >&2
            exit 1
          }
          echo "Linux yayın ikilisi 20 saniye açık kaldı."
      - name: Windows paketlenmiş yayın ikilisinin açılışını doğrula
        id: post_bundle_smoke
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/test-windows-release-binary.ps1
      - name: Windows NSIS Setup.exe kurulumunu ve açılışını doğrula
        id: nsis_smoke
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/test-windows-installed-nsis.ps1
      - name: Windows MSI kurulumunu ve kurulu uygulamayı doğrula
        id: msi_smoke
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/test-windows-installed-msi.ps1
      - name: Windows kurulum testlerini zorunlu tut
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        env:
          PRE_BUNDLE_OUTCOME: ${{ steps.pre_bundle_smoke.outcome }}
          POST_BUNDLE_OUTCOME: ${{ steps.post_bundle_smoke.outcome }}
          PRE_BUNDLE_IMPORTS_OUTCOME: ${{ steps.pre_bundle_imports.outcome }}
          POST_BUNDLE_IMPORTS_OUTCOME: ${{ steps.post_bundle_imports.outcome }}
          NSIS_OUTCOME: ${{ steps.nsis_smoke.outcome }}
          MSI_OUTCOME: ${{ steps.msi_smoke.outcome }}
        run: |
          $failures = @()
          if ($env:PRE_BUNDLE_OUTCOME -ne "success") { $failures += "Ham EXE (paketleme öncesi): $($env:PRE_BUNDLE_OUTCOME)" }
          if ($env:POST_BUNDLE_OUTCOME -ne "success") { $failures += "Paketlenmiş EXE: $($env:POST_BUNDLE_OUTCOME)" }
          if ($env:PRE_BUNDLE_IMPORTS_OUTCOME -ne "success") { $failures += "Ham EXE DLL import denetimi: $($env:PRE_BUNDLE_IMPORTS_OUTCOME)" }
          if ($env:POST_BUNDLE_IMPORTS_OUTCOME -ne "success") { $failures += "Paketlenmiş EXE DLL import denetimi: $($env:POST_BUNDLE_IMPORTS_OUTCOME)" }
          if ($env:NSIS_OUTCOME -ne "success") { $failures += "NSIS Setup.exe: $($env:NSIS_OUTCOME)" }
          if ($env:MSI_OUTCOME -ne "success") { $failures += "MSI: $($env:MSI_OUTCOME)" }
          if ($failures.Count -gt 0) {
            throw ("Windows kurulum kabul testleri başarısız: " + ($failures -join "; "))
          }
          Write-Host "Ham ve paketlenmiş EXE, NSIS Setup.exe ve MSI kabul testleri başarılı."


  yayina-al:
    name: Önizleme paketlerini doğrula ve yayımla
    needs: [hazirla, paketle]
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Tüm platform paketlerini doğrula ve önizlemeyi yayımla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.hazirla.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(node -p "require('./package.json').version")"
          PREVIEW_VERSION="${BASE_VERSION}-${GITHUB_RUN_NUMBER}"
          if [[ -z "$RELEASE_ID" ]]; then
            echo "Hazırlık işinden taslak önizleme kimliği alınamadı." >&2
            exit 1
          fi

          ASSETS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[].name')"
          REQUIRED_ASSETS=(
            "MIHENK_${PREVIEW_VERSION}_amd64.AppImage"
            "MIHENK_${PREVIEW_VERSION}_amd64.AppImage.sig"
            "MIHENK_${PREVIEW_VERSION}_amd64.deb"
            "MIHENK_${PREVIEW_VERSION}_amd64.deb.sig"
            "MIHENK_${PREVIEW_VERSION}_x64-setup.exe"
            "MIHENK_${PREVIEW_VERSION}_x64-setup.exe.sig"
            "MIHENK_${PREVIEW_VERSION}_x64_tr-TR.msi"
            "MIHENK_${PREVIEW_VERSION}_x64_tr-TR.msi.sig"
            "latest.json"
          )
          for asset in "${REQUIRED_ASSETS[@]}"; do
            if ! grep -Fqx "$asset" <<< "$ASSETS"; then
              echo "Önizleme yayımlanmadı; gerekli dosya eksik: $asset" >&2
              exit 1
            fi
          done

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -F prerelease=true

          # Yeni önizleme tamamen yayımlandıktan sonra eski yayımlanmış
          # preview kayıtlarını temizle; hazırlık aşamasında çalışan indirmeyi kesme.
          OLD_RELEASE_IDS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.tag_name == "preview" and .draft == false) | .id')"
          if [[ -n "$OLD_RELEASE_IDS" ]]; then
            while IFS= read -r old_release_id; do
              [[ -n "$old_release_id" && "$old_release_id" != "$RELEASE_ID" ]] || continue
              echo "Yeni önizleme yayımlandı; eski kayıt kaldırılıyor: $old_release_id"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${old_release_id}"
            done <<< "$OLD_RELEASE_IDS"
          fi
