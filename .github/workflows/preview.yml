name: MİHENK geliştirme önizlemesi

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: mihenk-onizleme-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    name: ${{ matrix.platform }} önizleme paketleri
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: "appimage,deb"
          - platform: windows-latest
            bundles: "nsis,msi"
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable
      - name: Linux paket bağımlılıklarını kur
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Bağımlılıkları kilitli kur
        run: npm ci --no-audit --no-fund
      - name: Önizleme sürümünü ve imza anahtarlarını hazırla
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(node -p "require('./package.json').version")"
          PREVIEW_VERSION="${BASE_VERSION}-preview.${GITHUB_RUN_NUMBER}"
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          node - "$PREVIEW_VERSION" "$TAURI_UPDATER_PUBLIC_KEY" <<'NODE'
          const fs = require("node:fs");
          const [version, pubkey] = process.argv.slice(2);
          const config = JSON.parse(fs.readFileSync("src-tauri/tauri.release.conf.json", "utf8"));
          config.version = version;
          config.plugins.updater.pubkey = pubkey;
          config.plugins.updater.endpoints = ["https://github.com/azmisahin-gov/mihenk/releases/download/preview/latest.json"];
          fs.writeFileSync("src-tauri/tauri.generated.conf.json", JSON.stringify(config, null, 2) + "\n");
          NODE
          echo "VITE_APP_VERSION=$PREVIEW_VERSION" >> "$GITHUB_ENV"
      - name: Derle ve önizleme kanalına yayımla
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: preview
          releaseName: MİHENK Geliştirme Önizlemesi
          releaseBody: "main dalındaki en son geliştirme yapısıdır. Deneme içindir; kararlı sürüm değildir."
          releaseDraft: false
          prerelease: true
          generateReleaseNotes: true
          args: --config src-tauri/tauri.generated.conf.json --bundles ${{ matrix.bundles }}
