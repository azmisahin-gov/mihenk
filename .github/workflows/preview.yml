name: MİHENK geliştirme önizlemesi

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: mihenk-onizleme-yayin
  cancel-in-progress: false

jobs:
  hazirla:
    name: Tek önizleme kaydı hazırla
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Eski önizleme kayıtlarını temizle ve tek taslak oluştur
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git push origin "${GITHUB_SHA}:refs/tags/preview" --force

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.tag_name == "preview") | .id' |
            while IFS= read -r old_release_id; do
              [[ -n "$old_release_id" ]] || continue
              echo "Önceki önizleme kaydı kaldırılıyor: $old_release_id"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${old_release_id}"
            done

          RELEASE_ID="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name=preview \
            -f name="MİHENK Geliştirme Önizlemesi" \
            -f body="main dalındaki en son geliştirme yapısıdır. Deneme içindir; kararlı sürüm değildir." \
            -F draft=true \
            -F prerelease=true \
            -f target_commitish="${GITHUB_SHA}" \
            --jq '.id')"
          test -n "$RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  paketle:
    name: ${{ matrix.platform }} önizleme paketleri
    needs: hazirla
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: "appimage,deb"
          - platform: windows-latest
            bundles: "nsis,msi"
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable
      - name: Linux paket bağımlılıklarını kur
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Bağımlılıkları kilitli kur
        run: npm ci --no-audit --no-fund
      - name: Kare uygulama simgelerini üret
        run: npx tauri icon src-tauri/icons/mihenk.svg --output src-tauri/icons
      - name: Önizleme sürümünü ve imza anahtarlarını hazırla
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(node -p "require('./package.json').version")"
          PREVIEW_VERSION="${BASE_VERSION}-${GITHUB_RUN_NUMBER}"
          if (( PREVIEW_RUN_NUMBER = ${GITHUB_RUN_NUMBER} )) && (( PREVIEW_RUN_NUMBER > 65535 )); then
            echo "MSI önizleme sürüm bileşeni 65535 sınırını aştı; package.json patch sürümünü artırın." >&2
            exit 1
          fi
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          node - "$PREVIEW_VERSION" "$TAURI_UPDATER_PUBLIC_KEY" <<'NODE'
          const fs = require("node:fs");
          const [version, pubkey] = process.argv.slice(2);
          const config = JSON.parse(fs.readFileSync("src-tauri/tauri.release.conf.json", "utf8"));
          config.version = version;
          config.plugins.updater.pubkey = pubkey;
          config.plugins.updater.endpoints = ["https://github.com/azmisahin-gov/mihenk/releases/download/preview/latest.json"];
          fs.writeFileSync("src-tauri/tauri.generated.conf.json", JSON.stringify(config, null, 2) + "\n");
          NODE
          echo "VITE_APP_VERSION=$PREVIEW_VERSION" >> "$GITHUB_ENV"
      - name: Güncelleme imza anahtarını UTF-8 BOM karakterinden arındır
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const raw = process.env.TAURI_SIGNING_PRIVATE_KEY || "";
          let key = raw;
          if (key.charCodeAt(0) === 0xfeff) key = key.slice(1);
          if (key.startsWith("ï»¿")) key = key.slice(3);
          key = key.trim();
          if (!key) throw new Error("TAURI_SIGNING_PRIVATE_KEY boş.");
          const delimiter = "MIHENK_PRIVATE_KEY_END";
          if (key.includes(delimiter)) throw new Error("İmza anahtarı ayırıcıyla çakışıyor.");
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `TAURI_SIGNING_PRIVATE_KEY<<${delimiter}\n${key}\n${delimiter}\n`,
            { encoding: "utf8", mode: 0o600 },
          );
          NODE
      - name: Derle ve önizleme kanalına yayımla
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          releaseId: ${{ needs.hazirla.outputs.release_id }}
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.generated.conf.json --bundles ${{ matrix.bundles }}


  yayina-al:
    name: Önizleme paketlerini doğrula ve yayımla
    needs: [hazirla, paketle]
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Tüm platform paketlerini doğrula ve önizlemeyi yayımla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.hazirla.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(node -p "require('./package.json').version")"
          PREVIEW_VERSION="${BASE_VERSION}-${GITHUB_RUN_NUMBER}"
          if [[ -z "$RELEASE_ID" ]]; then
            echo "Hazırlık işinden taslak önizleme kimliği alınamadı." >&2
            exit 1
          fi

          ASSETS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[].name')"
          REQUIRED_ASSETS=(
            "MIHENK_${PREVIEW_VERSION}_amd64.AppImage"
            "MIHENK_${PREVIEW_VERSION}_amd64.AppImage.sig"
            "MIHENK_${PREVIEW_VERSION}_amd64.deb"
            "MIHENK_${PREVIEW_VERSION}_amd64.deb.sig"
            "MIHENK_${PREVIEW_VERSION}_x64-setup.exe"
            "MIHENK_${PREVIEW_VERSION}_x64-setup.exe.sig"
            "MIHENK_${PREVIEW_VERSION}_x64_tr-TR.msi"
            "MIHENK_${PREVIEW_VERSION}_x64_tr-TR.msi.sig"
            "latest.json"
          )
          for asset in "${REQUIRED_ASSETS[@]}"; do
            if ! grep -Fqx "$asset" <<< "$ASSETS"; then
              echo "Önizleme yayımlanmadı; gerekli dosya eksik: $asset" >&2
              exit 1
            fi
          done

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -F prerelease=true
