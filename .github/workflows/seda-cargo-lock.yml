name: SEDA Cargo lockfile

on:
  push:
    branches:
      - feat/56-12-local-seda-asr
    paths:
      - "src-tauri/Cargo.toml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/56-12-local-seda-asr
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate exact dependency lock
        working-directory: src-tauri
        run: cargo generate-lockfile
      - name: Commit lockfile
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock already matches Cargo.toml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore: regenerate SEDA Cargo.lock"
          git push origin HEAD:feat/56-12-local-seda-asr
