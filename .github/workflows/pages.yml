name: MİHENK indirme sayfası

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mihenk-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: GitHub Pages yayını
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: GitHub Pages yapılandırmasını hazırla
        uses: actions/configure-pages@v5
      - name: İndirme sayfasını yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Sayfayı yayımla
        id: deployment
        uses: actions/deploy-pages@v4
