name: Bağımlılık kilit dosyalarını güncelle

on:
  push:
    branches: ["feat/yerel-gorev-kasasi"]
    paths:
      - "package.json"
      - "src-tauri/Cargo.toml"
      - ".github/workflows/dependency-lock.yml"

permissions:
  contents: write

concurrency:
  group: mihenk-dependency-lock
  cancel-in-progress: false

jobs:
  lock:
    name: npm ve Cargo kilit dosyalarını üret
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable
      - name: npm kilidini güncelle
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Cargo kilidini güncelle
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Kilit dosyalarını commit et
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Kilit dosyaları zaten güncel."
            exit 0
          fi
          git commit -m "Bağımlılık kilit dosyalarını güncelle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
