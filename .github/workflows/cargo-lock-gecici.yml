name: Geçici Rust kilit güncellemesi

on:
  push:
    branches: ["feat/56-12-ses-calisma-alani"]

permissions:
  contents: write

jobs:
  kilit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo kilidini güncelle
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Kilidi dala gönder
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cargo kilidini güncelle"
          git push origin "HEAD:${BRANCH_NAME}"
