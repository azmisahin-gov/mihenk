name: Geçici bağımlılık kilidi üretimi

on:
  push:
    branches: ["feat/56-12-ses-calisma-alani"]

permissions:
  contents: write

jobs:
  kilitleri-uret:
    name: npm ve Cargo kilit dosyalarını üret
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable
      - name: npm kilidini üret
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Cargo kilidini üret
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Kilit dosyalarını dala ekle
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Kilit dosyaları değişmedi."
            exit 0
          fi
          git commit -m "Bağımlılık kilit dosyalarını ekle"
          git push origin "HEAD:${BRANCH_NAME}"
