[package]
name = "mihenk"
version = "0.1.0"
description = "MİHENK masaüstü uygulaması"
authors = ["MİHENK"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.4" }

[dependencies]
sha2 = { version = "=0.10.9" }
tauri-plugin-dialog = { version = "=2.8.4" }
aes-gcm = { version = "=0.10.3" }
tauri = { version = "=2.12.5" }
tauri-plugin-updater = { version = "=2.14.1" }
tauri-plugin-process = { version = "=2.4.0" }
serde_json = { version = "=1.0.154" }
tauri-plugin-fs = { version = "=2.7.1" }
tauri-plugin-stronghold = { version = "=2.4.0" }
zeroize = { version = "=1.9.1" }
sha1 = { version = "=0.10.6" }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
sherpa-onnx = { version = "=2.0.1" }
symphonia = { version = "=0.6.1", default-features = false, features = ["aiff", "aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
